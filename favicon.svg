<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="32" cy="32" r="30" fill="#0a0e17"/>
  <!-- Outer Glow Ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#grad)" stroke-width="3"/>
  <!-- Alarm Bell Ears -->
  <path d="M14 12 L8 18" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M50 12 L56 18" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Clock Feet -->
  <path d="M18 52 L12 58" stroke="url(#grad)" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M46 52 L52 58" stroke="url(#grad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Clock Face -->
  <circle cx="32" cy="34" r="19" fill="#161f31" stroke="#334155" stroke-width="1.5"/>
  <!-- Clock Hands -->
  <line x1="32" y1="34" x2="32" y2="23" stroke="#f8fafc" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="42" y2="34" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="26" y2="40" stroke="#f43f5e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center Pin -->
  <circle cx="32" cy="34" r="2.5" fill="#f43f5e"/>
</svg>
